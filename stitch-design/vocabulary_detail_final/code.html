<!DOCTYPE html>

<html class="h-full" lang="en"><head>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background h-full font-body-md flex flex-col items-center pt-xl">
<!-- Vocabulary Card Container -->
<main class="w-full max-w-[1140px] px-container-margin md:px-lg mx-auto flex flex-col items-center justify-center flex-1 pb-xl">
<!-- Back Navigation (Contextual departure) -->
<div class="w-full max-w-md flex justify-start mb-md">
<button class="flex items-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined mr-xs" data-icon="arrow_back">arrow_back</span>
<span class="font-label-md text-label-md">Back to List</span>
</button>
</div>
<!-- The Premium Card -->
<article class="bg-surface-container-lowest border border-outline-variant/30 rounded-[20px] shadow-[0px_8px_30px_rgba(0,107,95,0.08)] w-full max-w-md overflow-hidden transition-all duration-300 hover:shadow-[0px_12px_40px_rgba(0,107,95,0.12)]">
<!-- Card Header / Image Area -->
<div class="relative h-48 w-full bg-surface-variant flex items-center justify-center overflow-hidden">
<!-- Abstract visual representing 'confident' -->
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed to-secondary-fixed opacity-50"></div>
<div class="z-10 bg-surface-container-lowest/80 backdrop-blur-sm rounded-full p-md shadow-sm border border-outline-variant/20">
<span class="material-symbols-outlined text-[64px] text-primary" data-icon="emoji_events">emoji_events</span>
</div>
</div>
<!-- Card Body -->
<div class="p-lg flex flex-col">
<!-- Word Header -->
<div class="flex justify-between items-start mb-md">
<div>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider mb-xs block font-bold">Adjective</span>
<h1 class="font-display-lg text-display-lg text-on-background m-0">Confident</h1>
<span class="font-body-md text-body-md text-on-surface-variant">/ˈkɒnfɪdənt/</span>
</div>
<!-- Audio Button -->
<button aria-label="Play pronunciation" class="w-12 h-12 rounded-full bg-secondary-fixed text-primary flex items-center justify-center hover:bg-primary hover:text-on-primary transition-colors shadow-sm flex-shrink-0">
<span class="material-symbols-outlined" data-icon="volume_up" data-weight="fill" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
<div class="w-full h-px bg-outline-variant/30 mb-md"></div>
<!-- Meaning -->
<div class="mb-md">
<h2 class="font-label-md text-label-md text-on-surface-variant mb-xs">Meaning</h2>
<p class="font-body-lg text-body-lg text-on-background">Feeling sure about yourself and your abilities; having self-assurance.</p>
</div>
<!-- Example -->
<div class="mb-xl bg-surface-container-low p-sm rounded-lg border border-outline-variant/20 relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary rounded-l-lg"></div>
<h2 class="font-label-md text-label-md text-primary mb-xs">Example</h2>
<p class="font-body-md text-body-md text-on-surface italic">"I feel confident speaking English during the interview."</p>
</div>
<!-- Actions -->
<div class="flex gap-sm mt-auto">
<!-- Save Action (Secondary) -->
<button class="flex-1 h-[56px] rounded-[20px] bg-primary/10 text-primary font-label-md text-label-md flex items-center justify-center gap-xs hover:bg-primary/20 transition-colors border border-primary/20">
<span class="material-symbols-outlined" data-icon="bookmark_border">bookmark_border</span>
                        Save
                    </button>
<!-- Practice Action (Primary) -->
<button class="flex-[2] h-[56px] rounded-[20px] bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center gap-xs hover:bg-primary/90 transition-colors shadow-[0px_4px_20px_rgba(0,107,95,0.3)]">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
                        Practice Pronunciation
                    </button>
</div>
</div>
</article>
</main>
</body></html>
