<style>
        /* Waveform Animation CSS */
        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            gap: 4px;
        }

        .bar {
            width: 4px;
            background-color: theme('colors.primary-container');
            border-radius: 9999px;
            animation: pulse 1s infinite ease-in-out alternate;
        }

        .bar:nth-child(1) { animation-delay: 0.1s; height: 12px; }
        .bar:nth-child(2) { animation-delay: 0.2s; height: 24px; }
        .bar:nth-child(3) { animation-delay: 0.3s; height: 36px; }
        .bar:nth-child(4) { animation-delay: 0.4s; height: 20px; }
        .bar:nth-child(5) { animation-delay: 0.5s; height: 28px; }
        .bar:nth-child(6) { animation-delay: 0.4s; height: 16px; }
        .bar:nth-child(7) { animation-delay: 0.3s; height: 24px; }
        .bar:nth-child(8) { animation-delay: 0.2s; height: 12px; }

        @keyframes pulse {
            0% { transform: scaleY(0.5); opacity: 0.5; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* Ambient Entrance Animation */
        .fade-up-enter {
            animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
