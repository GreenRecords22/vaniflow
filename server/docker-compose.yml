version: '3.8'

services:
  vaniflow-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaniflow-ai-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - VANIFLOW_APP_ID=com.vaniflow.app
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-groq/compound-mini}
      - PROVIDER_TIMEOUT_MS=10000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
